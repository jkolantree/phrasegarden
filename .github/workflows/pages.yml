name: Verify and deploy PhraseGarden

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "SHA256SUMS"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "release/phrasegarden-0.1.0-preview.9-pages-manifest.json"
      - "release/phrasegarden-0.1.0-preview.9-pages.zip"
      - "release/phrasegarden-0.1.0-preview.10-pages-manifest.json"
      - "release/phrasegarden-0.1.0-preview.10-pages.zip"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
      - "tsconfig.domain.json"
      - "vite.config.ts"
      - "vitest.config.ts"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact Preview 10 source and package ancestry
        run: >-
          test "$(git rev-list --parents -n 1 HEAD)"
          = "$(git rev-parse HEAD) $(git rev-parse HEAD^)"
          &&
          test "$(git rev-list --parents -n 1 HEAD^)"
          = "$(git rev-parse HEAD^) 8c0b90bba230e7b83b507b42a928c76e3f80a156"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 peeled commit
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the closed release tools
        run: python3 -m unittest discover -s tests/release -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: pnpm test
      - run: pnpm typecheck
      - name: Extract the exact qualified Pages archive
        run: >-
          python3 scripts/preview10-verify-release-archive.py
          --archive release/phrasegarden-0.1.0-preview.10-pages.zip
          --manifest release/phrasegarden-0.1.0-preview.10-pages-manifest.json
          --checksums SHA256SUMS
          --output dist
          --require-packaging-commit
      - run: >-
          node scripts/release-audit.mjs
          release/phrasegarden-0.1.0-preview.10-pages-manifest.json
      - name: Install exact Playwright Chromium without OS package refresh
        timeout-minutes: 10
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e:dist
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Confirm browser checks did not alter the qualified bytes
        run: >-
          node scripts/release-audit.mjs
          release/phrasegarden-0.1.0-preview.10-pages-manifest.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
