name: Verify and deploy PhraseGarden

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "SHA256SUMS"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "release/phrasegarden-0.1.0-preview.3-pages-manifest.json"
      - "release/phrasegarden-0.1.0-preview.3-pages.zip"
      - "release/phrasegarden-0.1.0-preview.4-pages-manifest.json"
      - "release/phrasegarden-0.1.0-preview.4-pages.zip"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
      - "tsconfig.domain.json"
      - "vite.config.ts"
      - "vitest.config.ts"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recovery-harness:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 peeled commit
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the repaired release-tool fixtures
        run: python3 -m unittest discover -s tests/release -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Test this recovery workflow policy
        run: pnpm exec vitest run tests/release/release-audit.test.ts

  verify:
    if: github.ref == 'refs/heads/main'
    needs: recovery-harness
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ed89c07a23526adc99f498eaaa05b7d10c144633
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm the exact qualified package commit
        run: >-
          test "$(git rev-parse HEAD)" = "ed89c07a23526adc99f498eaaa05b7d10c144633" &&
          test "$(git rev-list --parents -n 1 HEAD)" =
          "ed89c07a23526adc99f498eaaa05b7d10c144633 115d71fc8830357d6a57037de446947cf9d7c99d"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 peeled commit
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Extract the exact qualified Pages archive
        run: >-
          python3 scripts/preview4-verify-release-archive.py
          --archive release/phrasegarden-0.1.0-preview.4-pages.zip
          --manifest release/phrasegarden-0.1.0-preview.4-pages-manifest.json
          --checksums SHA256SUMS
          --output dist
          --require-packaging-commit
      - run: >-
          node scripts/release-audit.mjs
          release/phrasegarden-0.1.0-preview.4-pages-manifest.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:dist
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Confirm browser checks did not alter the qualified bytes
        run: >-
          node scripts/release-audit.mjs
          release/phrasegarden-0.1.0-preview.4-pages-manifest.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
